name: Project Automation

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to Project
        # This action automatically adds new issues/PRs to a GitHub Project (V2).
        # You need to set YOUR_GITHUB_TOKEN and the PROJECT_URL.
        uses: actions/add-to-project@v1.0.1
        with:
          # You should create a Personal Access Token (PAT) with `project` scope
          # and save it as a repository secret named `PROJECT_TOKEN`.
          github-token: ${{ secrets.PROJECT_TOKEN }}
          # The URL of your GitHub Project (e.g., https://github.com/users/username/projects/1)
          # project-url: https://github.com/users/YOUR_USERNAME/projects/YOUR_PROJECT_ID
          project-url: https://github.com/users/t16ak/projects/1
          
      # Note: Moving status to "Todo", "In Progress", "Done" can be easily configured
      # natively inside the GitHub Projects (V2) board settings -> Workflows.
      # For example, "Item added to project" -> set Status to "Todo".
      # "Pull request opened" -> set Status to "In Progress".
      # "Issue/PR closed" -> set Status to "Done".
